# 中文界面文案。
#
# 两点约定:
#   * 一个表要么只放 `other`(以及复数形式),要么只放子表,不能混用。
#     `[appearance]` 放的是分组标题,所以下面的选项标题用平铺的点号键,
#     而不是 `[appearance.light]` 这样的子表。
#   * 平铺的点号键必须写在第一个表头之前 —— TOML 里写在表头之后的键属于该表。

