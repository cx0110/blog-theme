# English UI copy.
#
# Two things to know about this file:
#   * A table may hold `other` (and plural forms) OR sub-tables, not both.
#     `[appearance]` carries the group label, so the option labels below are
#     flat dotted keys instead of `[appearance.light]` sub-tables.
#   * Flat dotted keys must appear before the first table header: in TOML, a
#     key written after a header belongs to that table.

"appearance.light" = "Light"
"appearance.dark" = "Dark"
"appearance.system" = "System"

[appearance]
other = "Appearance"

