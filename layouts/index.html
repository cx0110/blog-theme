{{ define "main" }}
<div class="site-main-inner">
  {{- with .Content }}
  <div class="page-head prose">{{ . }}</div>
  {{- end }}
  {{- $pages := .Site.RegularPages -}}
  {{- if $pages }}
  <div class="post-list">
    {{- range $pages }}
    {{ partial "post-card.html" . }}
    {{- end }}
  </div>
  {{- else }}
  <div class="post-list">
    <p class="post-card-summary">{{ i18n "noPosts" | default "Nothing here yet." }}</p>
  </div>
  {{- end }}
  {{ partial "pagination.html" . }}
</div>
{{ end }}
