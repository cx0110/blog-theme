name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hugo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: peaceiris/setup-hugo@v3
        with:
          hugo-version: "0.157.0"
          extended: true

      - name: Build the example site and assert the output
        run: node tests/check.mjs
